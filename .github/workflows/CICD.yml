name: ' CI/CD'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (Major.Minor). When empty, uses repoVersion from settings'
        required: false
        default: ''
      projects:
        description: 'Projects to build, comma-separated. When empty, builds all projects'
        required: false
        default: '*'
      publishArtifacts:
        description: 'Publish artifacts'
        type: boolean
        default: true
  push:
    branches:
      - main
      - release/*
      - feature/*
    paths-ignore:
      - '**.md'
      - '.github/*.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/*.json'

permissions:
  contents: read
  actions: read
  pull-requests: write

defaults:
  run:
    shell: powershell

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Initialization:
    runs-on: windows-latest
    outputs:
      projects: ${{ steps.determineProjectsToBuild.outputs.ProjectsJson }}
      projectsCount: ${{ steps.determineProjectsToBuild.outputs.ProjectsCount }}
      environments: ${{ steps.determineDeploymentEnvironments.outputs.EnvironmentsJson }}
      environmentsCount: ${{ steps.determineDeploymentEnvironments.outputs.EnvironmentsCount }}
      settings: ${{ steps.readSettings.outputs.SettingsJson }}
      buildModes: ${{ steps.readSettings.outputs.BuildModesJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v6.1
        with:
          shell: powershell
          eventId: 'DO0091'

      - name: Read Settings
        id: readSettings
        uses: microsoft/AL-Go-Actions/ReadSettings@v6.1
        with:
          shell: powershell
          get: type

      - name: Determine Projects To Build
        id: determineProjectsToBuild
        uses: microsoft/AL-Go-Actions/DetermineProjectsToBuild@v6.1
        with:
          shell: powershell
          projects: ${{ github.event.inputs.projects }}

      - name: Determine Deployment Environments
        id: determineDeploymentEnvironments
        uses: microsoft/AL-Go-Actions/DetermineDeploymentEnvironments@v6.1
        with:
          shell: powershell
          getEnvironments: '*'

  Build:
    needs: [ Initialization ]
    if: needs.Initialization.outputs.projectsCount > 0
    runs-on: ${{ fromJson(needs.Initialization.outputs.settings).githubRunner }}
    strategy:
      matrix:
        project: ${{ fromJson(needs.Initialization.outputs.projects) }}
        buildMode: ${{ fromJson(needs.Initialization.outputs.buildModes) }}
      fail-fast: false
    name: Build ${{ matrix.project }} (${{ matrix.buildMode }})
    outputs:
      AppsArtifactsName: ${{ steps.calculateArtifactNames.outputs.AppsArtifactsName }}
      TestAppsArtifactsName: ${{ steps.calculateArtifactNames.outputs.TestAppsArtifactsName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v6.1
        with:
          shell: powershell
          project: ${{ matrix.project }}

      - name: Read Secrets
        id: readSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v6.1
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'licenseFileUrl,insiderSasToken,keyVaultCertificateUrl,keyVaultCertificatePassword,keyVaultClientId'

      - name: Run Pipeline
        id: runPipeline
        uses: microsoft/AL-Go-Actions/RunPipeline@v6.1
        with:
          shell: powershell
          project: ${{ matrix.project }}
          buildMode: ${{ matrix.buildMode }}
          secrets: '${{ steps.readSecrets.outputs.Secrets }}'

      - name: Calculate Artifact Names
        id: calculateArtifactNames
        uses: microsoft/AL-Go-Actions/CalculateArtifactNames@v6.1
        if: success() || failure()
        with:
          shell: powershell
          project: ${{ matrix.project }}
          buildMode: ${{ matrix.buildMode }}

      - name: Publish Apps Artifacts
        uses: actions/upload-artifact@v4
        if: (success() || failure()) && (github.event.inputs.publishArtifacts == 'true' || github.event_name != 'workflow_dispatch')
        with:
          name: ${{ steps.calculateArtifactNames.outputs.AppsArtifactsName }}
          path: '${{ matrix.project }}/.buildartifacts/Apps/'
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Test Apps Artifacts
        uses: actions/upload-artifact@v4
        if: (success() || failure()) && (github.event.inputs.publishArtifacts == 'true' || github.event_name != 'workflow_dispatch')
        with:
          name: ${{ steps.calculateArtifactNames.outputs.TestAppsArtifactsName }}
          path: '${{ matrix.project }}/.buildartifacts/TestApps/'
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup
        if: always()
        uses: microsoft/AL-Go-Actions/PipelineCleanup@v6.1
        with:
          shell: powershell
          project: ${{ matrix.project }}

  Deploy:
    needs: [ Initialization, Build ]
    if: always() && needs.Build.result == 'success' && needs.Initialization.outputs.environmentsCount > 0 && github.event_name != 'pull_request'
    strategy:
      matrix:
        environment: ${{ fromJson(needs.Initialization.outputs.environments) }}
      fail-fast: false
    runs-on: ${{ fromJson(needs.Initialization.outputs.settings).runs-on }}
    name: Deploy to ${{ matrix.environment }}
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v6.1
        with:
          shell: powershell

      - name: Read Secrets
        id: readSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v6.1
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: '${{ matrix.environment }}_AuthContext,AuthContext'

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: '.artifacts'

      - name: Deploy
        uses: microsoft/AL-Go-Actions/Deploy@v6.1
        with:
          shell: powershell
          type: 'CD'
          projects: '*'
          environmentName: ${{ matrix.environment }}
          artifacts: '.artifacts'
          authContext: ${{ steps.readSecrets.outputs.Secrets }}

  PostProcess:
    runs-on: windows-latest
    needs: [ Initialization, Build, Deploy ]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v6.1
        with:
          shell: powershell
          eventId: 'DO0091'
          telemetryScopeJson: ${{ needs.Initialization.outputs.telemetryScopeJson }}
