name: 'Update AL-Go System Files'

on:
  workflow_dispatch:
    inputs:
      templateUrl:
        description: 'Template Repository URL (default is current template)'
        required: false
        default: ''
      directCommit:
        description: 'Direct commit to branch (otherwise create PR)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  workflows: write
  actions: read

defaults:
  run:
    shell: powershell

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  UpdateALGoSystemFiles:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v6.1
        with:
          shell: powershell
          eventId: 'DO0098'

      - name: Read Settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v6.1
        with:
          shell: powershell

      - name: Read Secrets
        id: readSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v6.1
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'ghTokenWorkflow'

      - name: Update AL-Go System Files
        uses: microsoft/AL-Go-Actions/CheckForUpdates@v6.1
        with:
          shell: powershell
          token: ${{ steps.readSecrets.outputs.ghTokenWorkflow }}
          templateUrl: ${{ github.event.inputs.templateUrl }}
          update: true
          directCommit: ${{ github.event.inputs.directCommit }}

  PostProcess:
    runs-on: windows-latest
    needs: UpdateALGoSystemFiles
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v6.1
        with:
          shell: powershell
          eventId: 'DO0098'
          telemetryScopeJson: ${{ needs.UpdateALGoSystemFiles.outputs.telemetryScopeJson }}
