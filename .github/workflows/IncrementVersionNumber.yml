name: 'Increment Version Number'

on:
  workflow_dispatch:
    inputs:
      versionNumber:
        description: 'New version number (Major.Minor, e.g., 2.0)'
        required: true
      directCommit:
        description: 'Direct commit to branch'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: powershell

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  IncrementVersionNumber:
    runs-on: windows-latest
    outputs:
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the workflow
        id: init
        uses: microsoft/AL-Go-Actions/WorkflowInitialize@v6.0
        with:
          shell: powershell

      - name: Read Settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v6.0
        with:
          shell: powershell

      - name: Read Secrets
        id: readSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v6.0
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'ghTokenWorkflow'

      - name: Increment Version Number
        uses: microsoft/AL-Go-Actions/IncrementVersionNumber@v6.0
        with:
          shell: powershell
          token: ${{ steps.readSecrets.outputs.ghTokenWorkflow || github.token }}
          versionNumber: ${{ github.event.inputs.versionNumber }}
          directCommit: ${{ github.event.inputs.directCommit }}

  PostProcess:
    runs-on: windows-latest
    needs: IncrementVersionNumber
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize the workflow
        id: PostProcess
        uses: microsoft/AL-Go-Actions/WorkflowPostProcess@v6.0
        with:
          shell: powershell
          telemetryScopeJson: ${{ needs.IncrementVersionNumber.outputs.telemetryScopeJson }}
